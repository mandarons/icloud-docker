exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# The image and CI both run Python 3.14 (see Dockerfile and .github/workflows).
# Pin it explicitly so ruff targets the interpreter that actually executes the
# code: without it ruff assumes an older default and suggests rewrites the
# runtime cannot support.
target-version = "py314"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["F", "E", "W",
# "C90",
 "I",
# "N",
# "D",
"UP", "YTT",
# "ANN",
"ASYNC",
# "S",
# "BLE",
# "FBT",
# "B",
# "A",
"COM",  "C4",
# "DTZ",
# "T10",
"DJ", "EM", "EXE",
#"FA",
# "ISC",
"ICN",
# "LOG",
# "G",
"INP", "PIE",
# "T20",
"PYI",
# "PT",
"Q", "RSE",
#"RET",
"SLF", "SLOT",
# "SIM",
"TID", "TCH", "INT",
# "ARG",
# "PTH",
"TD",
"FIX",
# "ERA",
"PD", "PGH",
# "PL",
# "TRY",
# "FLY",
"NPY", "AIR", "PERF",
# "FURB",
# "RUF"
]
ignore = ["E501"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# `import datetime` — never `as dt` — is this codebase's style, and ruff 0.17
# added `datetime as dt` as a default ICN001 alias. State the convention we
# actually use so ICN001 keeps enforcing the other aliases without flagging
# every datetime import in src/ and tests/.
[lint.flake8-import-conventions.aliases]
datetime = "datetime"

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
# Handed to the operator to run, not imported: it carries its own
# dependency block and probes clipboard backends in a loop.
"src/icloud_sign.py" = ["INP001", "PERF203"]
# `HardlinkRegistry` appears only in annotations in these two modules, but
# Python 3.14 evaluates annotations lazily at access time (PEP 649): with a
# TYPE_CHECKING-only import, `inspect.signature()` / `typing.get_type_hints()`
# raise `NameError: name 'HardlinkRegistry' is not defined`, and allure-pytest
# introspects test callables. Keep the runtime import, which is genuine.
"src/album_sync_orchestrator.py" = ["TC001"]
"src/photo_download_manager.py" = ["TC001"]


[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
# docstring-code-format = true
# docstring-code-line-length = 120

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
# docstring-code-line-length = "dynamic"