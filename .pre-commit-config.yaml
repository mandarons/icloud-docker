repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args:
          - --fix
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        stages: [manual]
      - id: check-json
        exclude: (.vscode|.devcontainer)
      - id: no-commit-to-branch
        args:
          - --branch=main
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      # Shipped code keeps B108 (hardcoded temp paths): src/bandit.yaml's
      # allow-list includes it.
      - id: bandit
        alias: bandit-src
        name: bandit (src)
        args:
          - --quiet
          - --format=custom
          - --configfile=src/bandit.yaml
        files: ^src/.+\.py$
      # Tests drop B108, which fires on their "/tmp/dest" placeholder paths.
      - id: bandit
        alias: bandit-tests
        name: bandit (tests)
        args:
          - --quiet
          - --format=custom
          - --configfile=tests/bandit.yaml
        files: ^tests/.+\.py$
