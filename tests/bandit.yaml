# https://bandit.readthedocs.io/en/latest/config.html

# `tests:` is an allow-list: bandit runs only the checks named here.
#
# B108 is deliberately absent. Bandit 1.9.0 started reporting B108 when files are
# passed by name, which is how the pre-commit hook invokes it, and every hit is a
# tests/ placeholder path (`destination_path="/tmp/dest"`) rather than a real
# temp-file write. src/ contains no hardcoded /tmp at all, so omitting it here
# masks nothing in shipped code and keeps the hook at what 1.8.6 reported on the
# same tree.
tests:
  - B103
  - B306
  - B307
  - B313
  - B314
  - B315
  - B316
  - B317
  - B318
  - B319
  - B320
  - B601
  - B602
  - B604
  - B608
  - B609
